name: Refresh card data

# Weekly: fetch Scryfall bulk data, rebuild the pack, publish it as a release,
# pin it in data/manifest.json, and redeploy the web app.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      - run: npm run data:build
      - id: pack
        run: |
          echo "version=$(node -p "require('./data/packs/manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "current=$(node -p "require('./data/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.pack.outputs.version == steps.pack.outputs.current
        run: echo "data pack ${{ steps.pack.outputs.version }} is already pinned; nothing to do"
      - if: steps.pack.outputs.version != steps.pack.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          ASSET="$(node -p "require('path').basename(new URL(require('./data/packs/manifest.json').url).pathname)")"
          gh release create "data-$VERSION" "data/packs/$ASSET" data/packs/manifest.json \
            --title "Card data $VERSION" \
            --notes "Card data pack built from Scryfall bulk data dated $VERSION. See data/README.md."
          cp data/packs/manifest.json data/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git commit -m "Card data $VERSION"
          git push
          gh workflow run deploy-web.yml --ref main
