<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <meta
      name="description"
      content="Turn a pile of bulk Magic: The Gathering cards into playable mono-color decks."
    />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Bulk Brew</title>
    <script>
      // Apply the saved appearance before first paint. Mirrors readAppearance in
      // packages/ui/src/data/useAppearance.ts; keep the key and rules in step.
      (function () {
        var a = {};
        try {
          a = JSON.parse(localStorage.getItem('bulk-brew.appearance')) || {};
        } catch (e) {}
        var mode = a.mode === 'dark' || a.mode === 'system' ? a.mode : 'light';
        var theme = ['W', 'U', 'B', 'R', 'G'].indexOf(a.theme) >= 0 ? a.theme : 'grey';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-mode', dark ? 'dark' : 'light');
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
